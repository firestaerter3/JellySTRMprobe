name: CI

# Builds and tests every push and pull request. TreatWarningsAsErrors is on, so the
# build step is also the analyser gate.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      # The plugin zip as an artifact, so a release can attach the exact build CI tested.
      - name: Package plugin zip
        run: |
          version=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' JellySTRMprobe/JellySTRMprobe.csproj)
          dotnet publish JellySTRMprobe/JellySTRMprobe.csproj -c Release --no-build -o publish
          mkdir -p dist
          (cd publish && zip -j "../dist/jellystrm-probe_${version}.zip" JellySTRMprobe.dll)
          (cd dist && md5sum *.zip)

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: jellystrm-probe-zip
          path: dist/*.zip
