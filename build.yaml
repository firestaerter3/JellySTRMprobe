version: "2.0.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "firestaerter3"
overview: "Probe STRM files to extract media info (codec, resolution, duration, audio)"
description: |
  JellySTRMprobe extracts media information from STRM file targets by probing
  remote streams. Jellyfin never probes STRM files during library scans — this
  plugin fills that gap.

  Features:
  - Fast start: playback of an already probed STRM item skips Jellyfin's probe and
    metadata refresh (about 10 seconds per start)
  - Scheduled task to probe unprobed STRM items, with a cap per run and a stop after
    consecutive failures
  - Waits while someone plays a STRM item, for providers with one connection
  - Catch-up mode to auto-probe new STRM items as they are added (off by default)
  - Configurable parallelism, timeout, and cooldown
  - Per-library selection for probing and fast start

  This plugin is designed to work alongside Xtream Library or any other STRM
  file generator.
category: "General"
artifacts:
  - "JellySTRMprobe.dll"
changelog: |
  ## v2.0.0.0
  - Requires Jellyfin 12 (.NET 10). Jellyfin 10.11 users stay on 1.x.
  - Fast start: an already probed STRM item starts without Jellyfin's probe and metadata
    refresh. Items without a known video stream still get the normal probe.
  - New limits: maximum items per run (500), stop after 10 failures in a row, wait while a
    STRM item is playing.
  - Safer defaults: one probe at a time, 2 s cooldown, catch-up off, no default schedule.
  - Catch-up mode now respects the library selection.
  ## v1.2.0.0
  - Delete failed STRM files after probing (opt-in)
  - Configurable failure threshold to prevent mass deletion when provider is down
  ## v1.0.0.0
  - Initial release
  - Scheduled task for bulk STRM probing
  - Catch-up mode for new items
  - Configuration UI with library selection
